<!DOCTYPE html>
<html>
<head><title>Comic Preview</title>
<style>body{font-family:Arial;text-align:center}.panel{border:3px solid #000;margin:15px;padding:10px;display:inline-block;width:280px;background:white} img{width:100%;height:250px;object-fit:cover}</style>
</head>
<body>
<h1>Your Comic - {{ story_prompt }}</h1>
<a href="/">Back Home</a>
<hr>
{% for panel in panels %}
<div class="panel">
<h3>Panel {{ panel.number }}</h3>
<img src="{{ panel.image_path }}">
<p>{{ panel.text }}</p>
</div>
{% endfor %}
<br><br>
<a href="/">Generate Another</a>
</body>
</html>
